modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Rxwkovo/mcBridge/issues"

[[mods]]
modId = "mcpfabric"
version = "${version}"
displayName = "MechAgent Bridge"
displayURL = "https://github.com/Rxwkovo/mcBridge"
${icon_property} = "assets/mcpfabric/icon.png"
authors = "Rxwkovo; derived from MCP Fabric by dabinayo"
description = '''Local MCP bridge for Create observation, production monitoring and scoped Minecraft construction.'''

[[dependencies.mcpfabric]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_dep}"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcpfabric]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dep}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = 'mechagent-meter.mixins.json'
