name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: NeoForge 1.21.1 and MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Build and test the supported mod
        run: ./gradlew :1.21.1-neoforge:build --no-daemon --max-workers=2 -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Check and test the MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Package and inspect release candidates
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/package-release.mjs "$GITHUB_REF_NAME"
          else
            node scripts/package-release.mjs
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mechagent-bridge
          path: release-assets/
          if-no-files-found: error
